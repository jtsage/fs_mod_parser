[package]
authors = ["JTSage <jtsage@gmail.com>"]
categories = ["parser-implementations"]
description = "Mod File Parser for Farming Simulator"
documentation = "https://docs.rs/fs_mod_parser"
edition = "2021"
homepage = "https://github.com/jtsage/fs_mod_parser"
keywords = ["parse", "farm_sim"]
license = "ISC"
name = "fs_mod_parser"
readme = "README.md"
repository = "https://github.com/jtsage/fs_mod_parser"
version = "0.1.5"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.38"
glob = "0.3.1"
image = { version = "0.25.2", default-features = false}
image_dds = {version = "0.6.0", default-features = false, features = ["image", "ddsfile"]}
md5 = "0.7.0"
pathdiff = "0.2.2"
roxmltree = { version = "0.20.0", default-features = false, features = ["std"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
webp = "0.3.0"
zip = { version = "=2.1.3", default-features = false, features = ["deflate", "deflate64", "lzma", "time", "zstd"]}
rayon = "1.10.0"
quick-xml = "0.37.2"

[dev-dependencies]
assert-json-diff = "2.0.2"
strum = "0.26"
strum_macros = "0.26"


[lints.clippy]
pedantic = "warn"
allow_attributes = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"
equatable_if_let = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
map_unwrap_or = "warn"
missing_docs_in_private_items = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
option_if_let_else = "warn"
or_fun_call = "warn"
partial_pub_fields = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
return_self_not_must_use = "warn"
# single_call_fn = "warn"
str_to_string = "warn"
string_to_string = "warn"
suspicious_operation_groupings = "warn"
unseparated_literal_suffix = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_self = "warn"

